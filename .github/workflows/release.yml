name: Release formats

# Manual job: given an existing tag, rebuild the distribution formats (TTC + WOFF2) from the TTFs
# in that release and upload them with a fresh SHA256SUMS. The fonts themselves are built on the
# Mac that holds the Sarasa/Recursive sources; this job only repackages what the tag already has.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.0.4"
        required: true

permissions:
  contents: write

jobs:
  formats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r tools/requirements.txt

      - name: Fetch the tag TTFs
        run: |
          set -euo pipefail
          mkdir -p fonts dist
          TAG="${{ inputs.tag }}"
          curl -fsSL -o dist/family.zip \
            "https://github.com/gjuoun/qublack/releases/download/${TAG}/QuBlack-family-${TAG#v}.zip"
          unzip -q -o dist/family.zip '*.ttf' -d fonts
          ls fonts/*.ttf | wc -l

      - name: Build TTC + WOFF2 + SHA256SUMS
        run: python3 tools/pack_release.py --tag "${{ inputs.tag }}" --fonts fonts

      - name: Upload the formats
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ inputs.tag }}" \
            dist/*.ttc dist/*.woff2 dist/*.zip dist/SHA256SUMS dist/README-release.txt --clobber
